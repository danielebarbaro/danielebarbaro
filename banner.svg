<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Daniele Barbaro, Staff Software Engineer and Fractional Tech Lead">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8a33d"/>
      <stop offset="100%" stop-color="#0e75b6"/>
    </linearGradient>
    <style>
      .mono { font-family: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
      .name { font-size: 62px; font-weight: 700; fill: #f0f6fc; letter-spacing: -1px; }
      .role { font-size: 26px; font-weight: 500; fill: #e8a33d; }
      .line { font-size: 19px; fill: #8b949e; }
      .tag  { font-size: 17px; fill: #58a6ff; }
      .cur  { fill: #e8a33d; }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="5" fill="url(#accent)"/>

  <!-- faint code grid -->
  <g opacity="0.05" fill="none" stroke="#58a6ff" stroke-width="1">
    <path d="M900 60 h240 M900 100 h180 M900 140 h240 M900 180 h140 M900 220 h240"/>
  </g>

  <g class="mono">
    <text x="70" y="78" class="line">&lt;?php // staff engineer, still in the code</text>
    <text x="70" y="152" class="name">Daniele Barbaro<tspan class="cur">_</tspan></text>
    <text x="70" y="196" class="role">Staff Software Engineer · Fractional Tech Lead</text>
    <text x="70" y="238" class="line">Symfony · Laravel · Node/TS · modular monoliths · CI/CD · LLMs on legacy</text>
    <text x="70" y="272" class="tag">plincode.tech · the clean code recipe for your business</text>
  </g>
</svg>
